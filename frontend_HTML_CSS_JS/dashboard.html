<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
</head>
<body>

    <h1>Bienvenue <span></span> sur votre tableau de bord</h1>

    <button id="logoutBtn">Déconnexion</button>

    <script>
    document.getElementById("logoutBtn").addEventListener("click", function () {
    
    // Supprimer le token
    localStorage.removeItem("token");

    // Si tu stockes aussi les infos utilisateur :
    localStorage.removeItem("user");

    // Redirection après déconnexion
    window.location.href = "index.html"; // ta page de connexion
});

    </script>
</body>
</html>
